<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Abstract elegant crochet-inspired design -->
  <g filter="url(#crochet-glow)">
    <!-- Main focal circle - elegant centerpiece -->
    <circle cx="512" cy="512" r="200" fill="none" stroke="url(#purple-gradient)" stroke-width="3" opacity="0.4"/>
    <circle cx="512" cy="512" r="160" fill="none" stroke="url(#purple-gradient)" stroke-width="2" opacity="0.6"/>
    <circle cx="512" cy="512" r="120" fill="none" stroke="url(#blue-gradient)" stroke-width="2" opacity="0.3"/>
    
    <!-- Abstract flowing lines - representing yarn/thread -->
    <path d="M 512 280 Q 480 240 460 280 L 480 320 Q 520 260 512 280 Q 560 320 512 240" 
          fill="none" stroke="url(#purple-gradient)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M 460 320 Q 440 280 420 320 L 380 280 Q 340 240 460 320" 
          fill="none" stroke="url(#blue-gradient)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Decorative abstract shapes -->
    <ellipse cx="300" cy="200" rx="120" ry="60" fill="url(#purple-gradient)" opacity="0.3" transform="rotate(-15)"/>
    <ellipse cx="724" cy="200" rx="120" ry="60" fill="url(#purple-gradient)" opacity="0.3" transform="rotate(15)"/>
    
    <ellipse cx="350" cy="750" rx="80" ry="40" fill="url(#blue-gradient)" opacity="0.4"/>
    <ellipse cx="674" cy="750" rx="80" ry="40" fill="url(#blue-gradient)" opacity="0.4"/>
    
    <!-- Small accent circles -->
    <circle cx="200" cy="900" r="50" fill="none" stroke="url(#purple-gradient)" stroke-width="2" opacity="0.8"/>
    <circle cx="824" cy="900" r="50" fill="none" stroke="url(#purple-gradient)" stroke-width="2" opacity="0.8"/>
    
    <circle cx="400" cy="850" r="30" fill="url(#blue-gradient)" opacity="0.5"/>
    <circle cx="624" cy="850" r="30" fill="url(#blue-gradient)" opacity="0.5"/>
  </g>
  
  <!-- Enhanced gradients with more variation -->
  <defs>
    <linearGradient id="purple-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d846f5;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#b557e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a90e2;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#4b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a6d4;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="purple-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d846f5;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.3" />
    </radialGradient>
    
    <radialGradient id="blue-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6a90e2;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#2a6d4;stop-opacity:0.3" />
    </radialGradient>
    
    <!-- Enhanced glow filter -->
    <filter id="crochet-glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>