<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Crochetly hero with transparent background -->
  <g filter="url(#crochet-glow)">
    <!-- Main circular crochet elements -->
    <circle cx="512" cy="380" r="120" fill="none" stroke="url(#purple-gradient)" stroke-width="3" opacity="0.8"/>
    <circle cx="380" cy="450" r="80" fill="none" stroke="url(#blue-gradient)" stroke-width="2.5" opacity="0.7"/>
    <circle cx="640" cy="450" r="80" fill="none" stroke="url(#blue-gradient)" stroke-width="2.5" opacity="0.7"/>
    
    <!-- Crochet hook/yarn needle -->
    <path d="M 512 280 Q 520 250 540 280 L 540 320 Q 530 340 512 360 L 520 380 Q 512 400 504 380 L 520 400" 
          fill="none" stroke="url(#purple-gradient)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Small decorative elements -->
    <circle cx="400" cy="600" r="25" fill="url(#purple-gradient)" opacity="0.4"/>
    <circle cx="624" cy="600" r="25" fill="url(#blue-gradient)" opacity="0.4"/>
    
    <!-- Bottom text placeholder -->
    <text x="512" y="750" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
          text-anchor="middle" fill="url(#purple-gradient)">CROCHETLY</text>
    <text x="512" y="800" font-family="Arial, sans-serif" font-size="24" 
          text-anchor="middle" fill="url(#blue-gradient)" opacity="0.8">Master the Art of Crochet</text>
  </g>
  
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="purple-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c746ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter for depth -->
    <filter id="crochet-glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>