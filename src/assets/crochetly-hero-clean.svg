<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Clean abstract crochet elements with transparency -->
  <g filter="url(#crochet-glow)">
    <!-- Main circular forms representing yarn/crochet elements -->
    <circle cx="512" cy="380" r="140" fill="none" stroke="url(#purple-gradient)" stroke-width="3" opacity="0.8"/>
    <circle cx="380" cy="450" r="100" fill="none" stroke="url(#blue-gradient)" stroke-width="3" opacity="0.7"/>
    <circle cx="640" cy="450" r="100" fill="none" stroke="url(#blue-gradient)" stroke-width="3" opacity="0.7"/>
    
    <!-- Abstract crochet hook shape -->
    <path d="M 512 280 Q 520 250 540 280 L 540 320 Q 530 340 512 360 L 520 380 Q 512 400 504 380 L 540 380 Q 520 360 540 340 512 320" 
          fill="none" stroke="url(#blue-gradient)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Small decorative circles -->
    <circle cx="400" cy="600" r="30" fill="url(#purple-gradient)" opacity="0.5"/>
    <circle cx="624" cy="600" r="30" fill="url(#blue-gradient)" opacity="0.5"/>
    
    <!-- Bottom accent circles -->
    <circle cx="320" cy="700" r="25" fill="none" stroke="url(#blue-gradient)" stroke-width="2" opacity="0.6"/>
    <circle cx="704" cy="700" r="25" fill="none" stroke="url(#purple-gradient)" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="purple-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c746ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle glow filter for depth -->
    <filter id="crochet-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>